name: nitro_zxing
description: >-
  Fast zxing-cpp barcode and QR reading and writing for Dart and Flutter over
  Nitro FFI, on Android, iOS, macOS, Windows and Linux.
version: 0.0.1
homepage: https://github.com/Shreemanarjun/nitro_zxing
repository: https://github.com/Shreemanarjun/nitro_zxing
issue_tracker: https://github.com/Shreemanarjun/nitro_zxing/issues
topics:
  - barcode-scanner
  - qr-code
  - zxing
  - ffi
  - camera

# Pure Dart package: no Flutter SDK dependency and no Flutter plugin block.
# The nitrogen-generated hook/build.dart builds the native library (a code
# asset) for `dart run`, `dart compile exe` and `flutter build` alike.
environment:
  sdk: ^3.13.4

# Native only (FFI). Declared so pub.dev doesn't infer web from nitro's
# web-safe imports.
platforms:
  android:
  ios:
  linux:
  macos:
  windows:

dependencies:
  hooks: ^2.2.0
  code_assets: ^2.1.0
  nitro: ^0.8.5

dev_dependencies:
  test: ^1.25.8
  lints: ^6.0.0
  build_runner: ^2.4.0
  nitro_generator: ^0.8.5

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec
